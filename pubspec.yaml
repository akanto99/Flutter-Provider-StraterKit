name: flutter_provider_straterkit
description: "Flutter Provider Starter Kit — MVVM + Repository Pattern"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # Storage
  shared_preferences: ^2.5.4

  # Environment
  flutter_dotenv: ^6.0.0

  # Network
  http: ^1.6.0

  # Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # UI / Widgets
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.2
  dropdown_button2: ^2.3.9
  loading_animation_widget: ^1.3.0
  font_awesome_flutter: ^10.12.0
  slide_switcher: ^1.1.2

  # Media
  image_picker: ^1.2.1
  crop_your_image: ^2.0.0
  pdf: ^3.11.3
  cached_network_image: ^3.4.1

  # File / Sharing
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.1
  internet_connection_checker: ^3.0.1

  # Maps / Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Auth / PIN
  pinput: ^6.0.1
  smart_auth: ^3.2.0

  # Notification
  onesignal_flutter: ^5.3.5

  # Deep Link / Socket
  app_links: ^6.4.0
  socket_io_client: ^3.1.2

  # Payment (optional — uncomment when integrated)
  flutter_sslcommerz: ^3.0.2

  # Optional services (commented out — enable when needed)
  # wakelock_plus: ^1.4.0
  # flutter_sticky_header: ^0.8.0
  # auto_size_text: ^3.0.0
  # file_picker: ^10.3.10
  # open_file: ^3.5.11
  # url_launcher: ^6.3.2
  # upgrader: ^12.5.0
  # image: ^4.8.0
  # image_cropper: ^9.1.0
  device_info_plus: ^12.3.0
  # timeago: ^3.7.1
  # flutter_html: ^3.0.0
  # google_maps_flutter: ^2.14.2
  # google_places_flutter: ^2.1.1
  # carousel_slider: ^5.1.2
  # video_player: ^2.9.2
  # package_info_plus: ^9.0.0
  facebook_app_events: ^0.27.2

  # Toast / Alert
  fluttertoast: ^9.0.0
  another_flushbar: ^1.12.32

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  image: ^4.8.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/images/
    - assets/images/splash/
    - assets/images/onboard/
    - assets/images/onboard/icons/
    - assets/map_theme/nighttheme.json
    - assets/map_theme/standaredtheme.json

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/hind-siliguri/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/hind-siliguri/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/hind-siliguri/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/hind-siliguri/HindSiliguri-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
